<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">System Architecture</title>
  <desc id="desc">Client, backend, and external service architecture for AI Trip Planner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .box { fill: rgba(255,255,255,0.92); stroke: #c7d2fe; stroke-width: 2; rx: 20; }
      .lane { fill: url(#bg); stroke: #cbd5e1; stroke-width: 2; rx: 30; }
      .title { font: 700 26px Inter, Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 20px Inter, Arial, sans-serif; fill: #0f172a; }
      .text { font: 500 16px Inter, Arial, sans-serif; fill: #334155; }
      .tiny { font: 500 14px Inter, Arial, sans-serif; fill: #475569; }
      .chip { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; rx: 999; }
      .chipText { font: 700 14px Inter, Arial, sans-serif; fill: #4338ca; }
      .arrow { stroke: #4f46e5; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1360" height="720" class="lane"/>
  <text x="60" y="74" class="title">AI Trip Planner — Smart Itinerary Engine</text>
  <text x="60" y="104" class="text">Three-tier pipeline: client orchestration, backend generation and enrichment, plus external map and LLM services.</text>

  <rect x="70" y="150" width="380" height="500" class="box"/>
  <rect x="510" y="150" width="380" height="500" class="box"/>
  <rect x="950" y="150" width="380" height="500" class="box"/>

  <text x="115" y="205" class="label">Client</text>
  <text x="555" y="205" class="label">Backend</text>
  <text x="995" y="205" class="label">External Services</text>

  <rect x="105" y="240" width="310" height="70" class="chip"/>
  <text x="125" y="270" class="chipText">Vite + React UI</text>
  <text x="125" y="292" class="tiny">Theme toggling, reset flow, and speech input</text>

  <rect x="105" y="330" width="310" height="70" class="chip"/>
  <text x="125" y="360" class="chipText">Speech Recognition API</text>
  <text x="125" y="382" class="tiny">Voice-to-text in Destination and notes fields</text>

  <rect x="105" y="420" width="310" height="70" class="chip"/>
  <text x="125" y="450" class="chipText">Preset Templates</text>
  <text x="125" y="472" class="tiny">One-click trip seeds for common scenarios</text>

  <rect x="545" y="240" width="310" height="70" class="chip"/>
  <text x="565" y="270" class="chipText">Node.js + Express</text>
  <text x="565" y="292" class="tiny">/api/plan and /api/refine routes</text>

  <rect x="545" y="330" width="310" height="70" class="chip"/>
  <text x="565" y="360" class="chipText">Gemini multi-model fallback</text>
  <text x="565" y="382" class="tiny">3.5 Flash Lite → 2.5 Flash → 2.5 Flash Lite</text>

  <rect x="545" y="420" width="310" height="70" class="chip"/>
  <text x="565" y="450" class="chipText">Timeout + schema guardrails</text>
  <text x="565" y="472" class="tiny">responseSchema, request racing, output validation</text>

  <rect x="985" y="240" width="300" height="70" class="chip"/>
  <text x="1005" y="270" class="chipText">Google Gemini API</text>
  <text x="1005" y="292" class="tiny">Structured itinerary and refinement generation</text>

  <rect x="985" y="330" width="300" height="70" class="chip"/>
  <text x="1005" y="360" class="chipText">OpenStreetMap / Nominatim</text>
  <text x="1005" y="382" class="tiny">Geocoding, reverse geocoding, map verification</text>

  <rect x="985" y="420" width="300" height="70" class="chip"/>
  <text x="1005" y="450" class="chipText">OSRM + Overpass</text>
  <text x="1005" y="472" class="tiny">Routing, travel-time estimation, fallback POIs</text>

  <path d="M 450 300 C 485 300, 490 300, 510 300" class="arrow"/>
  <path d="M 890 300 C 925 300, 930 300, 950 300" class="arrow"/>
  <path d="M 890 365 C 925 365, 930 365, 950 365" class="arrow dash"/>
  <path d="M 890 455 C 925 455, 930 455, 950 455" class="arrow dash"/>

  <text x="70" y="690" class="text">Client sends structured trip requests. Backend enriches the model output with real map data, then returns verified itinerary JSON to the UI.</text>
</svg>
